services:
  # 1. The PostgreSQL Database Container
  todo-db:
    image: postgres:15
    container_name: todo-postgres
    environment:
      # The postgres image reads POSTGRES_USER (not POSTGRES_USERNAME).
      # Reuse the app's credentials so there is only one set to maintain.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. The Spring Boot API Container
  todo-api:
    build: .
    container_name: todo-app
    ports:
      - "8080:8080"
    environment:
      # Inside Docker the DB is reached by its service name, not localhost
      - DB_URL=jdbc:postgresql://todo-db:5432/todo_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      todo-db:
        condition: service_healthy

volumes:
  postgres-data:
